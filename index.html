<!-- Ecosystem Dynamic Cards Module -->
<style>
  .eco-card-container { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
    max-width: 600px; 
    margin: 20px 0; 
  }
  .eco-card { 
    background: linear-gradient(145deg, #0d1117 0%, #161b22 100%); 
    border: 1px solid #30363d; 
    border-radius: 8px; 
    padding: 20px; 
    position: relative; 
  }
  .eco-card::before { 
    content: ''; 
    position: absolute; 
    top: 0; left: 0; width: 3px; height: 100%; 
    background: #ff3366; 
  }
  .eco-card-meta { 
    font-size: 0.75rem; 
    color: #8b949e; 
    font-family: monospace; 
    text-transform: uppercase; 
    margin-bottom: 8px; 
  }
  .eco-card-title { 
    color: #ffffff; 
    font-size: 1.1rem; 
    font-weight: 600; 
    text-decoration: none; 
    display: block; 
  }
  .eco-card-title:hover {
    color: #ff3366;
  }
</style>

<div class="eco-card-container">
  <div class="eco-card">
    <div class="eco-card-meta">// MODULE // ID: 01</div>
    <a href="/chat" class="eco-card-title">Starship Chat Hub</a>
  </div>
  <div class="eco-card">
    <div class="eco-card-meta">// MODULE // ID: 02</div>
    <a href="/flipbook/index" class="eco-card-title">Silent Resonance Cyberpunk Flipbook</a>
  </div>
</div>
