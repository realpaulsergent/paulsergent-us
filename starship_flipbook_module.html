<!-- 
    [AI MEMORY MANIFEST // AC v8.4]
    - Active Module: Cyberpunk Flipbook Reader (`starship_flipbook_module.html`) - Updated with red beta navigation button featuring synthetic Android audio feedback, plus an "Import Ebook" button alongside the top control panel.
-->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starship GemOS // Online Cyberpunk Flipbook Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030008; color: #e2e8f0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #080214; }
        ::-webkit-scrollbar-thumb { background: #d946ef; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #e879f9; }
        .cyber-glow { box-shadow: 0 0 15px rgba(217, 70, 239, 0.25), inset 0 0 15px rgba(6, 182, 212, 0.15); }
        .cyber-border { border: 1px solid rgba(217, 70, 239, 0.4); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden selection:bg-yellow-400 selection:text-black text-base">

    <!-- TOP DECK CYBERPUNK CONTROL BAR -->
    <header class="bg-[#0c041a] border-b border-fuchsia-500/40 px-6 py-3 flex justify-between items-center shrink-0 shadow-lg shadow-fuchsia-950/50">
        <div class="flex items-center space-x-3">
            <span class="w-3 h-3 rounded-full bg-yellow-400 animate-ping"></span>
            <h1 class="font-mono font-bold text-sm tracking-wider text-white">PAULSERGENT.US // <span class="text-yellow-400">CYBERPUNK FLIPBOOK READER</span></h1>
        </div>
        <div class="flex items-center space-x-3 font-mono text-xs">
            <label class="bg-[#180830] hover:bg-[#240c4a] text-cyan-300 border border-cyan-400/50 px-3.5 py-1.5 rounded-lg transition font-bold cursor-pointer shadow-md shadow-cyan-950">
                📂 Load Flipbook (.html) <input type="file" accept=".html,.txt" onchange="loadFlipbookPackage(event)" class="hidden">
            </label>
            <a href="starship_ebook_module.html" class="bg-[#180830] hover:bg-[#240c4a] text-yellow-300 border border-yellow-400/50 px-3.5 py-1.5 rounded-lg transition font-bold inline-flex items-center shadow-md shadow-yellow-950">📖 Offline Compiler</a>
        </div>
    </header>

    <!-- MAIN VIEWSHEET CONTAINER -->
    <div class="flex-grow flex flex-col items-center justify-start overflow-y-auto p-8 bg-[#030008]">
        
        <!-- READER INTERFACE CONTAINER -->
        <div class="w-full max-w-4xl bg-[#0c041a] cyber-border rounded-2xl p-8 shadow-2xl relative cyber-glow space-y-6">
            
            <!-- TOP SUB-BAR: RED BETA BUTTON & CONTROL TOGGLES -->
            <div class="flex justify-between items-center border-b border-fuchsia-500/30 pb-4">
                <!-- Red Beta Navigation Button with Android Click Sound -->
                <button onclick="playAndroidClickAndNavigate('../index.html')" class="bg-red-600 hover:bg-red-500 text-white font-mono px-4 py-2 rounded-lg text-xs font-bold shadow-lg shadow-red-950 transition flex items-center gap-2">
                    🔴 Return to Beta Site
                </button>

                <!-- Top Control Buttons Group -->
                <div class="flex items-center gap-3">
                    <button onclick="saveReaderBookmark()" class="bg-[#180830] hover:bg-[#240c4a] text-fuchsia-300 border border-fuchsia-400/50 px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition shadow-md">
                        🔖 Bookmark Page
                    </button>
                    <button onclick="toggleEditorPanel()" class="bg-[#180830] hover:bg-[#240c4a] text-cyan-300 border border-cyan-400/50 px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition shadow-md">
                        ⚙️ Toggle Editor
                    </button>
                    <button onclick="syncFromCompiler()" class="bg-yellow-500 hover:bg-yellow-400 text-black px-3.5 py-1.5 rounded-lg text-xs font-mono font-bold transition shadow-md shadow-yellow-950">
                        📥 Import Ebook
                    </button>
                </div>
            </div>

            <!-- BOOK TITLE & AUTHOR BANNER -->
            <div class="text-center space-y-2">
                <span class="text-xs font-mono text-yellow-400 uppercase tracking-widest">[Cyberpunk Serial & Teaser Stream]</span>
                <h1 id="reader-title" class="text-3xl font-bold text-white tracking-wide">Silent Resonance: Chrono Chronicles</h1>
                <p id="reader-author" class="font-mono text-sm text-cyan-300">Written by Paul Sergent</p>
            </div>

            <!-- BOOK CONTENT PANE -->
            <div id="reader-content-pane" class="bg-[#070112] border border-fuchsia-500/30 rounded-xl p-8 text-slate-200 text-lg leading-relaxed space-y-4 shadow-inner">
                <div class="text-center py-16 text-fuchsia-400/60 font-mono">
                    <p>⚡ Cyberpunk Flipbook Module Initialized.</p>
                    <p class="text-xs mt-2 text-slate-400">Click "Import Ebook" above to pull your live manuscript directly from your Ebook Compiler.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SYNTHETIC ANDROID CLICK AUDIO GENERATOR -->
    <script>
        function playAndroidClickAndNavigate(targetUrl) {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}

            setTimeout(function() {
                window.location.href = targetUrl;
            }, 80);
        }

        function syncFromCompiler() {
            var rawData = localStorage.getItem("starship_ebook_project");
            if (!rawData) {
                alert("No active manuscript found in your Ebook Compiler storage!");
                return;
            }
            var data = JSON.parse(rawData);
            document.getElementById('reader-title').innerText = data.title || "Silent Resonance: Chrono Chronicles";
            document.getElementById('reader-author').innerText = "Written by " + (data.author || "Paul Sergent");
            
            var contentPane = document.getElementById('reader-content-pane');
            contentPane.innerHTML = "";

            data.chapters.forEach(function(ch, idx) {
                var sec = document.createElement('div');
                sec.className = "mb-8 pb-6 border-b border-fuchsia-500/20";
                sec.innerHTML = '<h2 class="text-cyan-400 font-mono text-xl mb-4 font-bold">' + ch.title + '</h2>' +
                                (ch.image ? '<img src="' + ch.image + '" class="rounded-lg max-h-80 w-full object-cover mb-4 border border-fuchsia-500/40">' : '') +
                                '<div class="whitespace-pre-wrap text-slate-300 leading-relaxed">' + ch.content + '</div>';
                contentPane.appendChild(sec);
            });
            alert("Successfully imported " + data.chapters.length + " chapters from Ebook Compiler!");
        }

        function saveReaderBookmark() {
            var currentScroll = window.pageYOffset || document.documentElement.scrollTop;
            localStorage.setItem("paulsergent_cyberpunk_bookmark", currentScroll);
            alert("Cyberpunk bookmark locked in at current reading position!");
        }

        function toggleEditorPanel() {
            alert("Editor toggle active. Use Ebook Compiler workshop for deep structural edits.");
        }

        window.onload = function() {
            var autoData = localStorage.getItem("starship_ebook_project");
            if (autoData) {
                syncFromCompiler();
            }
        };
    </script>
</body>
</html>
